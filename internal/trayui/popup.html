<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --abyss:#091428; --deep:#0f1e33; --line:#463714; --gold:#c8aa6e; --gold-hi:#f0e6d2;
  --teal:#0ac8b9; --muted:#7b8a99;
}
*{box-sizing:border-box}
html,body{margin:0; width:100%; height:100%; overflow:hidden}
body{
  background:var(--abyss); color:var(--gold-hi);
  font:15px/1.4 Inter,system-ui,sans-serif;
  display:flex; align-items:center; justify-content:center;
  -webkit-user-select:text;
}
.card{
  width:100%; max-width:320px; padding:22px 26px; text-align:center;
}
h1{
  font:400 22px Marcellus,Georgia,serif; color:var(--gold); margin:0 0 4px;
  letter-spacing:.02em;
}
.sub{color:var(--muted); font-size:13px; margin:0 0 20px}
.field{margin-bottom:14px}
.label{
  font-size:11px; text-transform:uppercase; letter-spacing:.08em;
  color:var(--muted); margin:0 0 5px;
}
.value{
  font:600 15px/1.3 Inter,sans-serif; color:var(--gold-hi); word-break:break-all;
  background:var(--deep); border:1px solid var(--line); border-radius:3px;
  padding:8px 12px;
}
.value.pin{
  font:600 28px Marcellus,Georgia,serif; letter-spacing:.08em; color:var(--teal);
  padding:7px 12px;
}
.qr{
  margin-top:16px; display:inline-block; padding:8px; background:#fff;
  border-radius:4px; line-height:0;
}
.qr img{display:block; width:150px; height:150px}
.hint{color:var(--muted); font-size:12px; margin:12px 0 0}
.update{
  display:inline-block; margin-top:14px; padding:6px 14px;
  background:var(--deep); border:1px solid var(--gold); border-radius:20px;
  color:var(--gold); font:600 12px Inter,sans-serif; cursor:pointer;
}
.update:hover{background:var(--line)}
.update:disabled{opacity:.5; cursor:default; background:var(--deep)}
.ver{position:absolute; top:10px; right:12px; font-size:10px; color:var(--muted); opacity:.7}
</style>
</head>
<body>
<div class="ver">LoL Remote __VERSION__</div>
<div class="card">
  <h1>LoL Remote</h1>
  <p class="sub">Scan the code or type the address on your phone</p>

  <div class="field">
    <p class="label">Address</p>
    <p class="value">__URL__</p>
  </div>
  <div class="field">
    <p class="label">PIN code</p>
    <p class="value pin">__PIN__</p>
  </div>

  <div class="qr"><img src="data:image/png;base64,__QR__" alt="QR code"></div>
  <p class="hint">Same Wi-Fi network as this PC (or set up Tailscale for mobile data — see the README)</p>
  __UPDATE__
</div>
<script>
async function installUpdateClicked(btn, url){
  btn.disabled = true;
  btn.textContent = "Downloading…";
  try {
    const err = await window.installUpdate(url);
    if (err) { btn.disabled = false; btn.textContent = "Update"; alert(err); return; }
    // Success: the update installs silently in the background and this
    // app restarts itself once done. Nothing left to click here.
    btn.textContent = "Updating…";
  } catch (e) {
    btn.disabled = false; btn.textContent = "Update";
    alert(String(e));
  }
}
</script>
</body>
</html>
